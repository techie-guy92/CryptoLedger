apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cryptoledger-tls
  namespace: crypto
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: cryptoledger-tls
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.host }}
