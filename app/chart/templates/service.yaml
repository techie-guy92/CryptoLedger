apiVersion: v1
kind: Service
metadata:
  name: cryptoledger
  namespace: crypto
  labels:
    app: cryptoledger
    monitoring: "django"
spec:
  selector:
    app: cryptoledger
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  type: ClusterIP
