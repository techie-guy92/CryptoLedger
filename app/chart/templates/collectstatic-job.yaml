apiVersion: batch/v1
kind: Job
metadata:
  name: cryptoledger-collectstatic
  namespace: crypto
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: cryptoledger-collectstatic
    spec:
      restartPolicy: Never
      containers:
      - name: collectstatic
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command:
        - /bin/sh
        - -c
        - |
          until pg_isready -h postgres -p 5432; do sleep 2; done
          python manage.py collectstatic --noinput
        envFrom:
        - configMapRef:
            name: cryptoledger-config
        - secretRef:
            name: crypto-secrets
