apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: crypto
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
  - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: crypto
        podSelector:
          matchLabels:
            app: cryptoledger
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: crypto
        podSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
    ports:
      - protocol: TCP
        port: 5432
