apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoledger
  namespace: crypto
  labels:
    app: cryptoledger
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cryptoledger
  template:
    metadata:
      labels:
        app: cryptoledger
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: cryptoledger
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: collectstatic
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h postgres -p 5432; do
            echo "PostgreSQL not ready yet..."
            sleep 2
          done
          echo "PostgreSQL is ready! Running collectstatic..."
          python manage.py collectstatic --noinput
        envFrom:
        - configMapRef:
            name: cryptoledger-config
        - secretRef:
            name: crypto-secrets
        volumeMounts:
        - name: static
          mountPath: /app/staticfiles
      containers:
      - name: cryptoledger
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        startupProbe:
          httpGet:
            path: /health/live/
            port: {{ .Values.service.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.ingress.host }}
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/ready/
            port: {{ .Values.service.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.ingress.host }}
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health/live/
            port: {{ .Values.service.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.ingress.host }}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        envFrom:
        - configMapRef:
            name: cryptoledger-config
        - secretRef:
            name: crypto-secrets
        volumeMounts:
        - name: media
          mountPath: /app/media
        - name: static
          mountPath: /app/staticfiles
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: cryptoledger-media-pvc
      - name: static
        emptyDir: {}
