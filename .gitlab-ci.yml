stages:
  - lint
  - build
  - test
  - update-manifests

variables:
  REGISTRY: "192.168.122.1:5000"
  IMAGE_NAME: "crypto"
  PROJECT_DIR: app/source
  VALUES_FILE: app/chart/values.yaml

default:
  tags:
    - local-registry-runner

lint:
  stage: lint
  image: 192.168.122.1:5000/python:3.12-slim
  before_script:
    - pip install black isort
  script:
    - cd $PROJECT_DIR
    - black --check .
    - isort --profile black --check-only .

build:
  stage: build
  image: 192.168.122.1:5000/docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - IMAGE_TAG="v1.3.${CI_PIPELINE_IID}"
    - FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
    - docker version
    - docker build -t "$FULL_IMAGE" -f "$PROJECT_DIR/Dockerfile" "$PROJECT_DIR"
    - docker image inspect "$FULL_IMAGE"
    - docker tag "$FULL_IMAGE" "${REGISTRY}/${IMAGE_NAME}:latest"
    - docker push "$FULL_IMAGE"
    - docker push "$REGISTRY/$IMAGE_NAME:latest"
    - echo "$IMAGE_TAG" > image_tag.txt
  artifacts:
    paths:
      - image_tag.txt
    expire_in: 1 day

unit-tests:
  stage: test
  image: 192.168.122.1:5000/python:3.12-slim
  needs:
    - job: build
      artifacts: false
      optional: true
  before_script:
    - cd $PROJECT_DIR
    - pip install -r requirements.txt
  script:
    - python manage.py test --settings=config.test_settings

update-manifests:
  stage: update-manifests
  image: 192.168.122.1:5000/alpine:latest
  needs:
    - job: build
      artifacts: false
    - job: unit-tests
      artifacts: false
  before_script:
    - apk add --no-cache git sed openssh-client
    - git remote set-url origin https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/techie-guy92/cryptoledger.git
  script:
    - |
        IMAGE_TAG="v1.3.${CI_PIPELINE_IID}"

        git config user.email "gitlab-ci@gitlab.com"
        git config user.name "GitLab CI"

        echo "Updating values.yaml on MAIN branch..."
        git checkout main
        git pull origin main
        sed -i "0,/tag:.*/s//tag: ${IMAGE_TAG}/" "$VALUES_FILE"
        git add "$VALUES_FILE"
        if ! git diff --cached --quiet; then
          git commit -m "Update image tag to ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
        else
          echo "No manifest changes on main."
        fi

        echo "Updating values.yaml on DEVELOP branch..."
        git checkout develop
        git pull origin develop
        sed -i "0,/tag:.*/s//tag: ${IMAGE_TAG}/" "$VALUES_FILE"
        git add "$VALUES_FILE"
        if ! git diff --cached --quiet; then
          git commit -m "Sync image tag to ${IMAGE_TAG} from main [skip ci]"
          git push origin HEAD:develop
        else
          echo "No manifest changes on develop."
        fi

        git checkout main
        git fetch origin main
        git reset --hard origin/main
        echo "Both branches updated with image tag: ${IMAGE_TAG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
